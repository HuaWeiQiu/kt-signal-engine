[package]
name = "kt-signal-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "KT Signal protocol engine sidecar (libsignal-based, AGPL-3.0)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# presage 全家桶按 rev 钉定（ADR 0003：服务层 = presage + libsignal-service，
# 传递钉 libsignal tag v0.99.0）。许可：两者均 AGPL-3.0-only，与本仓一致。
# default-features=false：不引 cdsi（联系方式发现）与 sqlcipher 捆绑构建。
presage = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", default-features = false }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "33dd1491130793390e356e15a5711f1e6ca14fdb", default-features = false }

# 接收管线（Stream 组合）与异步运行时；io-std/io-util 供 stdout writer。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
url = "2.5"

# store 的 sqlite 后端走 bundled 纯 sqlite（无系统依赖、无 sqlcipher/openssl）；
# 版本以 Cargo.lock 实际解析的 sqlx 同版为准，特性经由全图归一生效。
libsqlite3-sys = { version = "0.36", features = ["bundled"] }

# 出口代理：libsignal-service 的 HTTP/WS 传输就是 reqwest（缺省读系统/环境变量
# 代理），本仓显式引入只为把 `socks` feature 并入全图——使 ALL_PROXY=socks5://…
# 生效（main.rs 把 connector 注入的 KT_SIGNAL_SOCKS_PROXY 映射过去）。特性按
# additive 归一，不改变上游用法；reqwest 许可 MIT/Apache-2.0。
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

# 仅 backup5-spike bin（ADR 0005 S1）生成链接密码用；与 presage 传递的 rand
# 0.9 同源，许可 MIT/Apache-2.0。
rand = "0.9"

# ADR 0005 S2：存量历史迁移（backup5）接收侧。
# - libsignal-message-backup（官方，v0.99.0 与传递钉定同 tag）：frame（HMAC+AES-CBC+gzip
#   解密面）与 parse（varint 分帧）均为 pub 生产 API；default-features=false 不引
#   json/cli/scramble/test-util。
# - prost（MIT/Apache-2.0）：运行时解码自持的 backup.proto 生成代码（src/proto/，
#   官方开源协议 schema 经 prost-build 一次性生成提交，构建期无 protoc 依赖）。
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", default-features = false }
# BackupKey/BackupId 派生（ADR 0005 S2，同 tag 直接依赖）。
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
thiserror = "2"

[dev-dependencies]
# fixture 构建专用：官方 export 原语（gzip/pad/AES-CBC/HMAC）造加密备份样本。
# 仅测试编译面合并，不进运行时依赖图。
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", default-features = false, features = ["test-util"] }
