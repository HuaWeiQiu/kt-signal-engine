# rust-lang/rust#157750: on macOS 27, dyld rejects dylibs whose LINKEDIT
# string pool is not pointer-size aligned ("mis-aligned LINKEDIT string
# pool"). The misalignment is produced by rustc's bundled rust-objcopy, which
# cargo runs in debug-free profiles (release defaults to strip=debuginfo), so
# every release-profile proc-macro dylib fails to dlopen and release builds
# cannot compile proc-macro dependents. `-C strip=none` alone is the confirmed
# fix: the objcopy pass never runs and the linker's own (correct) alignment
# stands. Dev profiles default to strip=none already, so this is a no-op
# there; Linux CI is unaffected (macOS-only by cfg). Trade-off: release
# artifacts keep their symbol tables — strip them at packaging time if size
# matters. Remove this file once the project toolchain is rustc >= 1.98.0
# (first stable carrying the LLVM fix).
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "strip=none"]
