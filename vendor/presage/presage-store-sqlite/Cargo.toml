[package]
name = "presage-store-sqlite"
version = "0.8.0-dev"
edition = "2024"
license = "AGPL-3.0-only"

[features]
default = ["libsqlite3-sys/bundled-sqlcipher"]
# KT (vendored): the upstream `cdsi` feature is removed — it required
# `libsqlite3-sys/bundled-sqlcipher-custom-crypto`, which no crates.io
# libsqlite3-sys provides, so merely declaring it made every standalone
# (non-engine-workspace) build of this crate unresolvable. The engine never
# enables cdsi (see vendor/README.md).

[dependencies]
presage = { path = "../presage", default-features = false }

async-trait = "0.1.83"
bytes = "1.9.0"
chrono = "0.4.38"
prost = "0.14.4"
serde_json = "1.0.135"
sqlx = { version = "0.9.0", features = [
    "json",
    "sqlite",
    "uuid",
    "runtime-tokio",
] }
thiserror = "2.0.0"
tracing = "0.1.41"
uuid = "1.12.0"

# Explicitly use the libsqlite3-sys crate with the bundled-sqlcipher feature
libsqlite3-sys = { version = "0.36.0", features = [] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt", "macros"] }
rand = "0.9"

# KT (vendored): standalone workspace root so this crate's own tests can run
# without being captured by the consumer workspace sitting above vendor/.
[workspace]

# KT (vendored): same fork wiring as the consuming engine's [patch], so the
# standalone test build links the vendored presage/libsignal-service (KT
# forks) instead of the pinned git sources.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "../../libsignal-service" }

[patch."https://github.com/whisperfish/presage"]
presage = { path = "../presage" }
