name: CI

on:
  push:
    branches: [main, develop, pre]
  pull_request:
    branches: [main, develop, pre]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: KTAIorg/kt-workflows/.github/workflows/polyglot-ci.yml@v1.9.2
